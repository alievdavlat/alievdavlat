<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 320 560" width="320" height="560" fill="none" role="img"
     aria-label="Davlatbek Aliev developer ID badge">
  <title>Davlatbek Aliev — Developer ID</title>
  <defs>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1830"/><stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity=".33"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="52" y="150" width="216" height="330" rx="18"/></clipPath>
    <clipPath id="avclip"><circle cx="160" cy="238" r="46"/></clipPath>
    <filter id="lglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:'Cascadia Code','Fira Code','Consolas',monospace}
      .sans{font-family:'Segoe UI','Trebuchet MS',Arial,sans-serif}
      @keyframes drop { 0%{transform:translateY(-120px);opacity:0} 100%{transform:translateY(0);opacity:1} }
      @keyframes sway {
        0%{transform:rotate(7deg)} 15%{transform:rotate(-5.5deg)} 30%{transform:rotate(4deg)}
        45%{transform:rotate(-2.6deg)} 60%{transform:rotate(1.6deg)} 75%{transform:rotate(-1deg)}
        88%{transform:rotate(.5deg)} 100%{transform:rotate(0deg)}
      }
      #intro{ animation: drop .9s ease-out both; }
      #pend{ transform-box: fill-box; transform-origin: 160px 12px; animation: sway 6s ease-in-out .9s infinite; }
      @keyframes glide { 0%{transform:translateX(-260px) skewX(-18deg)} 60%,100%{transform:translateX(260px) skewX(-18deg)} }
      .shineband{ animation: glide 4.5s ease-in-out infinite; }
    </style>
  </defs>

  <g id="intro">
  <g id="pend">
    <!-- clasp / ring at top -->
    <circle cx="160" cy="18" r="10" fill="none" stroke="#8aa0bd" stroke-width="4"/>
    <rect x="150" y="26" width="20" height="14" rx="3" fill="#8aa0bd"/>
    <!-- lanyard straps -->
    <path d="M154 40 L96 150 L120 150 L160 52 Z" fill="url(#strap)" opacity=".92"/>
    <path d="M166 40 L224 150 L200 150 L160 52 Z" fill="url(#strap)" opacity=".92"/>
    <!-- printed text on strap -->
    <text x="128" y="118" class="mono" font-size="10" fill="#04121f" font-weight="700" transform="rotate(-59 128 118)">DEV · CODE · SHIP</text>
    <text x="196" y="112" class="mono" font-size="10" fill="#04121f" font-weight="700" transform="rotate(59 196 112)">DAVLATBEK</text>
    <!-- clip connecting strap to card -->
    <rect x="146" y="140" width="28" height="20" rx="4" fill="#9fb2cc"/>
    <rect x="152" y="146" width="16" height="8" rx="2" fill="#0a1120"/>

    <!-- CARD -->
    <rect x="52" y="150" width="216" height="330" rx="18" fill="url(#card)" stroke="#22d3ee" stroke-opacity=".5"/>
    <rect x="52" y="150" width="216" height="46" rx="18" fill="#0c1a30"/>
    <rect x="52" y="178" width="216" height="18" fill="#0c1a30"/>
    <text x="70" y="179" class="mono" font-size="12" fill="#22d3ee" font-weight="700">DEVELOPER ID</text>
    <text x="250" y="179" text-anchor="end" class="mono" font-size="11" fill="#5b6b86">ALV·02</text>

    <!-- avatar -->
    <circle cx="160" cy="238" r="52" fill="none" stroke="url(#ring)" stroke-width="3" filter="url(#lglow)"/>
    <circle cx="160" cy="238" r="46" fill="#0c1a30"/>
    <text x="160" y="252" text-anchor="middle" class="sans" font-size="34" font-weight="800" fill="#22d3ee">DA</text>

    <!-- name + role + handle -->
    <text x="160" y="322" text-anchor="middle" class="sans" font-size="21" font-weight="800" fill="#e6f6ff">Davlatbek Aliev</text>
    <text x="160" y="346" text-anchor="middle" class="mono" font-size="12.5" fill="#22d3ee">Full-Stack Software Engineer</text>
    <rect x="104" y="360" width="112" height="24" rx="12" fill="#0c1a30" stroke="#2563eb" stroke-opacity=".5"/>
    <text x="160" y="376" text-anchor="middle" class="mono" font-size="12" fill="#67e8f9">@alievdavlat</text>

    <!-- tech row -->
    <text x="160" y="408" text-anchor="middle" class="mono" font-size="10.5" fill="#5b6b86">React · Node · Next · Docker</text>

    <!-- barcode -->
    <g fill="#cfe6f5" transform="translate(78,424)">
      <rect x="0"   width="3" height="34"/><rect x="6" width="2" height="34"/><rect x="11" width="4" height="34"/>
      <rect x="18"  width="2" height="34"/><rect x="23" width="3" height="34"/><rect x="30" width="5" height="34"/>
      <rect x="39"  width="2" height="34"/><rect x="44" width="3" height="34"/><rect x="50" width="2" height="34"/>
      <rect x="55"  width="4" height="34"/><rect x="63" width="2" height="34"/><rect x="68" width="3" height="34"/>
      <rect x="75"  width="5" height="34"/><rect x="84" width="2" height="34"/><rect x="89" width="3" height="34"/>
      <rect x="96"  width="2" height="34"/><rect x="101" width="4" height="34"/><rect x="109" width="2" height="34"/>
      <rect x="114" width="3" height="34"/><rect x="121" width="5" height="34"/><rect x="130" width="2" height="34"/>
      <rect x="135" width="3" height="34"/><rect x="141" width="2" height="34"/><rect x="146" width="4" height="34"/>
    </g>

    <!-- holographic shine -->
    <g clip-path="url(#cardclip)">
      <rect class="shineband" x="0" y="150" width="90" height="330" fill="url(#shine)" transform="skewX(-18)"/>
    </g>
  </g>
  </g>
</svg>
